<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>AS500 UI Editor</title><style>
*{box-sizing:border-box}body{margin:0;background:#18211f;color:#e8eeeb;font:14px Arial;display:flex;height:100vh}aside{width:280px;padding:14px;background:#24312e;overflow:auto}button,input,textarea{width:100%;margin:4px 0;padding:7px}.row{display:flex;gap:6px}.row>*{flex:1}main{flex:1;overflow:auto;padding:20px}.stage{position:relative;background:#eef1ed;width:1024px;height:600px}.el{position:absolute;overflow:hidden}.el.sel{outline:3px solid #27a8ff;z-index:9999!important}.txt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;white-space:pre-wrap}.json{height:220px;font:11px Consolas}.list div{padding:5px;border-bottom:1px solid #45534f;cursor:pointer}.list .on{background:#526d64}
</style></head><body><aside><h2>AS500 UI</h2><div class="row"><button id="reload">JSON 불러오기</button><button id="save">저장</button></div><input id="pick" type="file" accept=".json"><label>ID</label><input id="id"><label>문자</label><input id="text"><div class="row"><input id="x" type="number" placeholder="X"><input id="y" type="number" placeholder="Y"></div><div class="row"><input id="w" type="number" placeholder="W"><input id="h" type="number" placeholder="H"></div><label>배경색</label><input id="bg" type="color"><label>글자색</label><input id="tx" type="color"><label>폰트</label><input id="fs" type="number"><h3>요소</h3><div id="list" class="list"></div><h3>JSON</h3><textarea id="json" class="json" readonly></textarea></aside><main><div id="stage" class="stage"></div></main><script>
const $=id=>document.getElementById(id),FILE='as500_layout.json';let model={meta:{width:1024,height:600},elements:[]},sel=-1;const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
function levelGauge(e){const px=e.pivot_x??78,py=e.pivot_y??67;let ticks='';for(let i=0;i<=10;i++){const a=(-120-i*12)*Math.PI/180,ri=i%2?49:45;ticks+=`<line x1="${px+Math.cos(a)*ri}" y1="${py+Math.sin(a)*ri}" x2="${px+Math.cos(a)*58}" y2="${py+Math.sin(a)*58}" stroke="#29312f" stroke-width="${i%2?2:5}"/>`}const icon=e.icon==='fuel_pump'?'<g fill="#29312f"><rect x="110" y="54" width="17" height="25"/><rect x="108" y="78" width="22" height="3"/><path d="M127 58L134 62V75L131 77" fill="none" stroke="#29312f" stroke-width="2"/></g><rect x="113" y="57" width="11" height="8" fill="#f4f6f4"/>':'<g fill="none" stroke="#29312f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M108 61V49l-5 7m5-7 5 7M120 49v12l-5-7m5 7 5-7M102 70q6-6 12 0t12 0M102 80q6-6 12 0t12 0M135 48v36M129 52h6M129 62h6M129 72h6M129 82h6"/></g>';return `<svg viewBox="0 0 172 134" width="100%" height="100%">${ticks}<line x1="${px}" y1="${py}" x2="${px-52}" y2="${py}" stroke="#e94b3c" stroke-width="5"/><circle cx="${px}" cy="${py}" r="8" fill="#e94b3c"/>${icon}<text x="${px+14}" y="29" text-anchor="middle" font-size="28" font-weight="700">F</text><text x="${px+14}" y="124" text-anchor="middle" font-size="28" font-weight="700">E</text></svg>`}
function dial(e){const steer=e.type==='steering_gauge',w=e.w,h=e.h,cx=w/2,cy=steer?112:83,r=steer?76:52;let ticks='';for(let i=0;i<=10;i++){const a=(-165+i*15)*Math.PI/180,ri=r-(i%2?9:14);ticks+=`<line x1="${cx+Math.cos(a)*ri}" y1="${cy+Math.sin(a)*ri}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}" stroke="#29312f" stroke-width="${i%2?2:4}"/>`}return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%">${ticks}<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-r+18}" stroke="#e32626" stroke-width="5"/><circle cx="${cx}" cy="${cy}" r="7" fill="#e32626"/></svg>`}
function render(){const s=$('stage');s.innerHTML='';s.style.width=model.meta.width+'px';s.style.height=model.meta.height+'px';model.elements.forEach((e,i)=>{const n=document.createElement('div');n.className='el'+(i===sel?' sel':'');n.style.cssText=`left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;background:${e.bg==='#00000000'?'transparent':e.bg};border:${e.bw||0}px solid ${e.bd||'transparent'};border-radius:${e.r||0}px;color:${e.tx||'#20302c'};z-index:${e.z||1}`;const t=document.createElement('div');t.className='txt';t.style.fontSize=(e.fs||16)+'px';t.style.fontWeight=e.font_weight||400;if(e.type==='analog_level_gauge')t.innerHTML=levelGauge(e);else if(e.type==='analog_meter'||e.type==='steering_gauge')t.innerHTML=dial(e);else t.textContent=e.text||'';n.appendChild(t);n.onclick=()=>{sel=i;render()};s.appendChild(n)});$('list').innerHTML=model.elements.map((e,i)=>`<div class="${i===sel?'on':''}" data-i="${i}">${esc(e.label||e.id)}</div>`).join('');$('list').querySelectorAll('div').forEach(n=>n.onclick=()=>{sel=+n.dataset.i;render()});$('json').value=JSON.stringify(model,null,2);fill()}
function fill(){const e=model.elements[sel];for(const k of ['id','text','x','y','w','h','bg','tx','fs'])$(k).value=e?.[k]??''}for(const k of ['id','text','x','y','w','h','bg','tx','fs'])$(k).oninput=()=>{const e=model.elements[sel];if(!e)return;e[k]=['x','y','w','h','fs'].includes(k)?Number($(k).value):$(k).value;render()};async function loadDefault(){const r=await fetch(FILE+'?t='+Date.now());model=await r.json();sel=-1;render()}$('reload').onclick=loadDefault;$('pick').onchange=async e=>{model=JSON.parse(await e.target.files[0].text());sel=-1;render()};$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(model,null,2)],{type:'application/json'}));a.download=FILE;a.click()};loadDefault().catch(()=>{});
</script></body></html>
